<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>The Magic Sum</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>The Magic Sum</h1>
      <p class="sub">Predict the total before anyone says a number.</p>
      <section class="controls">
        <label
          >Digits per row
          <input id="digits" type="number" min="2" max="20" value="5"
        /></label>
        <label
          >Audience rows
          <input id="pairs" type="number" min="1" max="6" value="2"
        /></label>
        <button id="start">Start new trick</button>
      </section>
      <div class="board">
        <div class="paper" id="paper"></div>
        <aside id="note" class="note"></aside>
      </div>
      <p id="hint" class="hint"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
